# The gate, hosted (NFR-1, plan task G0.1), modelled on go-tuiMaps'.
#
# Every push and pull request: the quick gate on linux/amd64 and linux/arm64.
# On dispatch, and nightly, the full gate - fuzzing, the pinned vulnerability
# scan, the cross-compiles and the mutants - on both, so a new advisory is
# seen the next morning, not at the next push (watchpost D-262). P10 runs
# where the harness is set up and is named NOT RUN here, on the hosted
# runners.
#
# The nightly schedule fires only from the repository's default branch: while
# this workflow lives on another branch alone, it never runs on a schedule,
# and the full gate is run by dispatch.
name: gate
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate-${{ github.head_ref || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  gate:
    strategy:
      fail-fast: false # one architecture's red must not hide the other's result
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, built for Node.js 24 (watchpost F-216)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0, built for Node.js 24
        with:
          go-version: "1.27.3" # installs Go; the gate then runs every leg on the floor toolchain it reads from go.mod (watchpost D-152, RC-12)
      - name: the pinned vulnerability scanner, on PATH for the steps that follow
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: quick gate
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: scripts/gate --quick
      - name: full gate
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: scripts/gate

  both-architectures:
    needs: gate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: both architectures ran green
        run: |
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "the gate did not run green on both linux/amd64 and linux/arm64: ${{ needs.gate.result }}"
            exit 1
          fi
